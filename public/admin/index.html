<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>发文后台 · li1574的blog</title>
    <style>
      :root {
        --bg: #fdfdfd;
        --panel: #ffffff;
        --fg: #282728;
        --muted: #6b7280;
        --border: #e3e0e0;
        --accent: #006cac;
        --ok: #0f7b4f;
        --err: #b42318;
        --code: #f5f4f2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #212737;
          --panel: #2a3244;
          --fg: #eaedf3;
          --muted: #afb9ca;
          --border: #3b465c;
          --accent: #6fb3e0;
          --ok: #6ee7a8;
          --err: #ff8b8b;
          --code: #1b2130;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
      h1 { font-size: 20px; margin: 0; font-weight: 500; }
      header a { color: var(--muted); text-decoration: none; font-size: 13px; }
      header a:hover { color: var(--accent); }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; }
      .row > .field { flex: 1 1 200px; }
      .field { margin-bottom: 14px; }
      label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
      input[type="text"], input[type="password"], input[type="datetime-local"], textarea, select {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
      }
      textarea { resize: vertical; min-height: 320px; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px; line-height: 1.7; }
      input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
      .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
      .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      button {
        font: inherit;
        padding: 9px 18px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover { opacity: 0.9; color: #fff; }
      button.danger:hover { border-color: var(--err); color: var(--err); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .status { margin-top: 16px; font-size: 13px; min-height: 22px; }
      .status.ok { color: var(--ok); }
      .status.err { color: var(--err); }
      .status a { color: inherit; }
      .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
      .card-head h2 { font-size: 15px; font-weight: 500; margin: 0; }
      .flist { display: flex; flex-direction: column; }
      .frow { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-top: 1px solid var(--border); cursor: pointer; }
      .frow:first-child { border-top: none; }
      .frow:hover { background: var(--code); }
      .frow input { width: auto; margin: 0; }
      .ftitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .fmeta { font-size: 12px; color: var(--muted); white-space: nowrap; }
      .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 4px; }
      .pitem { position: relative; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--code); }
      .pitem img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
      .pbar { display: flex; gap: 6px; padding: 6px; }
      .pbar button { flex: 1; padding: 4px 6px; font-size: 12px; border-radius: 5px; }
      .pbar button.danger:hover { border-color: var(--err); color: var(--err); }
      input[type="file"] { padding: 7px 9px; }
      .inline { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
      .inline input { width: auto; }
      code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>发文后台</h1>
        <a href="/">← 回到博客</a>
      </header>

      <div class="card">
        <div class="row">
          <div class="field">
            <label for="pw">发文口令</label>
            <input id="pw" type="password" autocomplete="current-password" placeholder="部署时用 wrangler secret 设置" />
            <div class="hint">只存在当前标签页，关掉就没了</div>
          </div>
          <div class="field">
            <label for="pick">载入已有文章</label>
            <select id="pick"><option value="">— 新建文章 —</option></select>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="field">
          <label for="title">标题</label>
          <input id="title" type="text" placeholder="文章标题" />
        </div>

        <div class="row">
          <div class="field">
            <label for="slug">文件名（决定 URL）</label>
            <input id="slug" type="text" placeholder="留空自动生成" />
            <div class="hint">最终地址：<code id="urlPreview">/posts/…</code></div>
          </div>
          <div class="field">
            <label for="date">发布时间</label>
            <input id="date" type="datetime-local" />
          </div>
        </div>

        <div class="field">
          <label for="desc">摘要</label>
          <input id="desc" type="text" placeholder="一两句话，会显示在列表页和搜索结果里" />
        </div>

        <div class="row">
          <div class="field">
            <label for="tags">标签</label>
            <input id="tags" type="text" placeholder="用英文逗号分隔，例如：技术, 随笔" />
          </div>
          <div class="field" style="flex: 0 0 auto; align-self: center; padding-top: 18px">
            <span class="inline"><input id="draft" type="checkbox" /><label for="draft" style="margin: 0">存为草稿</label></span>
          </div>
        </div>

        <div class="field">
          <label for="body">正文（Markdown）</label>
          <textarea id="body" placeholder="正文从 ## 二级标题开始写，不要用 # （标题已在 frontmatter 里）&#10;&#10;## 小标题&#10;&#10;正文段落……"></textarea>
          <div class="hint">回车即换行，空一行分段 · Ctrl / Cmd + S 直接发布</div>
        </div>

        <div class="actions">
          <button class="primary" id="submit">发布</button>
          <button id="reset">清空新建</button>
          <button id="deletePost" class="danger" hidden>删除这篇</button>
          <span class="hint" id="counter"></span>
        </div>
        <div class="status" id="status"></div>
      </div>

      <div class="card" id="featuredCard" hidden>
        <div class="card-head">
          <h2>精选文章</h2>
          <span class="hint">勾选后出现在首页「精选」区</span>
        </div>
        <div id="featuredList" class="flist"></div>
        <div class="status" id="featuredStatus"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>图片</h2>
          <span class="hint">存到仓库 images 分支，不进构建</span>
        </div>
        <div class="field">
          <label for="files">上传</label>
          <input id="files" type="file" accept="image/*" multiple />
          <div class="hint">
            jpg / jpeg / png / gif / webp / avif / svg / bmp，可多选 · 上传前自动压缩到长边 2000px（gif 和 svg 不压）
          </div>
        </div>
        <div id="photoGrid" class="pgrid"></div>
        <div class="status" id="photoStatus"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>音乐</h2>
          <span class="hint">存到仓库 Release，不进构建</span>
        </div>
        <div class="field">
          <label for="audioFiles">上传</label>
          <input id="audioFiles" type="file" accept="audio/*" multiple />
          <div class="hint">
            mp3 / flac / wav / m4a / aac / ogg / opus / aiff，单个上限 50MB，曲名取文件名
          </div>
        </div>
        <div id="musicList" class="flist"></div>
        <div class="status" id="musicStatus"></div>
      </div>
    </div>

    <script>
      const $ = id => document.getElementById(id);
      const els = {
        pw: $("pw"), pick: $("pick"), title: $("title"), slug: $("slug"), date: $("date"),
        desc: $("desc"), tags: $("tags"), draft: $("draft"), body: $("body"),
        submit: $("submit"), reset: $("reset"), status: $("status"), counter: $("counter"),
        urlPreview: $("urlPreview"),
        featuredCard: $("featuredCard"), featuredList: $("featuredList"),
        featuredStatus: $("featuredStatus"),
        deletePost: $("deletePost"), files: $("files"),
        photoGrid: $("photoGrid"), photoStatus: $("photoStatus"),
        audioFiles: $("audioFiles"), musicList: $("musicList"), musicStatus: $("musicStatus"),
      };

      let dirty = false;
      let loadingPost = false;
      let allPosts = [];
      let currentPath = "";

      const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      const pad = n => String(n).padStart(2, "0");
      function localNow() {
        const d = new Date();
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function setStatus(text, kind = "") {
        els.status.className = "status" + (kind ? " " + kind : "");
        els.status.innerHTML = text;
      }

      function slugify(raw) {
        return raw
          .trim()
          .toLowerCase()
          .replace(/['"’]/g, "")
          .replace(/[^\p{Letter}\p{Number}]+/gu, "-")
          .replace(/^-+|-+$/g, "");
      }

      function updatePreview() {
        const raw = els.slug.value.trim() || slugify(els.title.value);
        const ascii = raw.replace(/[^\x00-\x7F]/g, "").replace(/-/g, "");
        els.urlPreview.textContent = "/posts/" + (ascii.length >= 2 ? raw : "post-时间戳");
      }

      function updateCounter() {
        els.counter.textContent = `${els.body.value.length} 字`;
      }

      async function api(path, options = {}) {
        const res = await fetch(path, {
          ...options,
          headers: { "x-admin-password": els.pw.value, ...(options.headers || {}) },
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `请求失败（${res.status}）`);
        return data;
      }

      async function loadList() {
        if (!els.pw.value) return;
        try {
          const { posts } = await api("/api/posts");
          allPosts = posts;
          els.pick.innerHTML =
            '<option value="">— 新建文章 —</option>' +
            posts.map(p => `<option value="${esc(p.path)}">${esc(p.title || p.name)}</option>`).join("");
          renderFeatured();
        } catch (error) {
          setStatus("读取文章列表失败：" + error.message, "err");
        }
      }

      function renderFeatured() {
        els.featuredCard.hidden = allPosts.length === 0;
        els.featuredList.innerHTML = allPosts
          .map(p => {
            const date = (p.pubDatetime || "").slice(0, 10);
            const flag = p.draft ? "草稿 · " : "";
            return `<label class="frow">
              <input type="checkbox" data-path="${esc(p.path)}" ${p.featured ? "checked" : ""}>
              <span class="ftitle">${esc(p.title || p.name)}</span>
              <span class="fmeta">${flag}${esc(date)}</span>
            </label>`;
          })
          .join("");
      }

      async function toggleFeatured(path, featured, checkbox) {
        checkbox.disabled = true;
        els.featuredStatus.className = "status";
        els.featuredStatus.textContent = "正在提交…";
        try {
          const data = await api("/api/featured", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ path, featured }),
          });
          const item = allPosts.find(p => p.path === path);
          if (item) item.featured = featured;
          els.featuredStatus.className = "status ok";
          els.featuredStatus.innerHTML =
            `${featured ? "已设为精选" : "已取消精选"} · <a href="${data.commit}" target="_blank" rel="noopener">查看提交</a> · ${data.note}`;
        } catch (error) {
          checkbox.checked = !featured;
          els.featuredStatus.className = "status err";
          els.featuredStatus.textContent = "操作失败：" + error.message;
        } finally {
          checkbox.disabled = false;
        }
      }

      function parseFrontmatter(text) {
        const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
        if (!match) return { meta: {}, body: text };
        const meta = {};
        const tags = [];
        let inTags = false;
        for (const line of match[1].split(/\r?\n/)) {
          const tagItem = line.match(/^\s+-\s+(.*)$/);
          if (inTags && tagItem) {
            tags.push(tagItem[1].replace(/^["']|["']$/g, ""));
            continue;
          }
          inTags = false;
          const kv = line.match(/^([A-Za-z_]+):\s*(.*)$/);
          if (!kv) continue;
          const [, key, value] = kv;
          if (key === "tags") { inTags = true; continue; }
          meta[key] = value.replace(/^["']|["']$/g, "");
        }
        if (tags.length) meta.tags = tags.join(", ");
        return { meta, body: text.slice(match[0].length) };
      }

      function setPhotoStatus(text, kind = "") {
        els.photoStatus.className = "status" + (kind ? " " + kind : "");
        els.photoStatus.textContent = text;
      }

      function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
          reader.onerror = () => reject(new Error("读取文件失败"));
          reader.readAsDataURL(blob);
        });
      }

      function formatBytes(n) {
        if (n >= 1048576) return `${(n / 1048576).toFixed(1)}MB`;
        return `${Math.max(1, Math.round(n / 1024))}KB`;
      }

      /**
       * 上传前压缩：长边最多 2000px，质量 0.85。
       * gif（怕丢动画）和 svg（矢量没必要）原样上传。
       * 压完比原图还大就不压。
       */
      async function compressImage(file) {
        const ext = (file.name.split(".").pop() || "").toLowerCase();
        const passthrough = { blob: file, name: file.name };
        if (["gif", "svg"].includes(ext)) return passthrough;

        let bitmap;
        try {
          bitmap = await createImageBitmap(file);
        } catch {
          return passthrough;
        }

        const MAX_EDGE = 2000;
        const scale = Math.min(1, MAX_EDGE / Math.max(bitmap.width, bitmap.height));
        const width = Math.max(1, Math.round(bitmap.width * scale));
        const height = Math.max(1, Math.round(bitmap.height * scale));

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        if (!ctx) {
          bitmap.close && bitmap.close();
          return passthrough;
        }
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(bitmap, 0, 0, width, height);
        bitmap.close && bitmap.close();

        // 可能带透明通道的格式优先转 webp，保住透明；不支持时退回 jpeg
        const wantsAlpha = ["png", "webp", "avif"].includes(ext);
        const attempts = wantsAlpha
          ? [["image/webp", "webp"], ["image/jpeg", "jpg"]]
          : [["image/jpeg", "jpg"]];

        for (const [type, newExt] of attempts) {
          const blob = await new Promise(res => canvas.toBlob(res, type, 0.85));
          if (!blob || blob.type !== type) continue;
          if (blob.size >= file.size) return passthrough;
          const stem = file.name.replace(/\.[^.]+$/, "");
          return { blob, name: `${stem}.${newExt}` };
        }
        return passthrough;
      }

      function renderPhotos(photos) {
        els.photoGrid.innerHTML = "";
        if (!photos.length) {
          els.photoGrid.innerHTML = '<p class="hint">还没有图片。</p>';
          return;
        }
        for (const photo of photos) {
          const item = document.createElement("div");
          item.className = "pitem";

          const img = document.createElement("img");
          img.src = photo.url;
          img.alt = photo.name;
          img.loading = "lazy";
          img.title = photo.name;

          const bar = document.createElement("div");
          bar.className = "pbar";

          const copy = document.createElement("button");
          copy.textContent = "复制";
          copy.title = "复制 Markdown 引用";
          copy.addEventListener("click", async () => {
            const md = `![${photo.name}](${photo.url})`;
            try {
              await navigator.clipboard.writeText(md);
              setPhotoStatus(`已复制：${md}`, "ok");
            } catch {
              setPhotoStatus("复制失败，手动复制：" + md, "err");
            }
          });

          const del = document.createElement("button");
          del.textContent = "删除";
          del.className = "danger";
          del.addEventListener("click", () => removePhoto(photo.name));

          bar.append(copy, del);
          item.append(img, bar);
          els.photoGrid.appendChild(item);
        }
      }

      async function loadPhotos() {
        if (!els.pw.value) return;
        try {
          const { photos } = await api("/api/photos");
          renderPhotos(photos);
        } catch (error) {
          setPhotoStatus("读取图片失败：" + error.message, "err");
        }
      }

      async function uploadFiles(files) {
        if (!els.pw.value) return setPhotoStatus("先填发文口令。", "err");
        const list = [...files];
        if (!list.length) return;

        let saved = 0;
        for (let i = 0; i < list.length; i++) {
          const file = list[i];
          setPhotoStatus(`处理中 ${i + 1}/${list.length}：${file.name}`);
          try {
            const { blob, name } = await compressImage(file);
            const data = await blobToBase64(blob);
            const sizeNote =
              blob.size < file.size
                ? `（${formatBytes(file.size)} → ${formatBytes(blob.size)}）`
                : `（${formatBytes(blob.size)}）`;
            setPhotoStatus(`上传中 ${i + 1}/${list.length}：${name}${sizeNote}`);
            await api("/api/upload", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ name, data }),
            });
            saved += Math.max(0, file.size - blob.size);
          } catch (error) {
            setPhotoStatus(`第 ${i + 1} 张失败：${error.message}`, "err");
            return;
          }
        }

        els.files.value = "";
        await loadPhotos();
        setPhotoStatus(
          `已上传 ${list.length} 张${saved > 0 ? `，共省下 ${formatBytes(saved)}` : ""}`,
          "ok"
        );
      }

      async function removePhoto(name) {
        if (!confirm(`确定删除图片 ${name}？\n\n引用它的文章会变成坏图。`)) return;
        setPhotoStatus("正在删除…");
        try {
          const data = await api("/api/photo?name=" + encodeURIComponent(name), {
            method: "DELETE",
          });
          await loadPhotos();
          setPhotoStatus(data.note, "ok");
        } catch (error) {
          setPhotoStatus("删除失败：" + error.message, "err");
        }
      }

      function setMusicStatus(text, kind = "") {
        els.musicStatus.className = "status" + (kind ? " " + kind : "");
        els.musicStatus.textContent = text;
      }

      function renderMusic(tracks) {
        els.musicList.innerHTML = "";
        if (!tracks.length) {
          els.musicList.innerHTML = '<p class="hint">还没有曲子。</p>';
          return;
        }
        for (const track of tracks) {
          const row = document.createElement("div");
          row.className = "frow";

          const title = document.createElement("span");
          title.className = "ftitle";
          title.textContent = track.title;

          const meta = document.createElement("span");
          meta.className = "fmeta";
          meta.textContent = formatBytes(track.size);

          const del = document.createElement("button");
          del.textContent = "删除";
          del.className = "danger";
          del.style.padding = "2px 8px";
          del.style.fontSize = "12px";
          del.addEventListener("click", () => removeTrack(track.name));

          row.append(title, meta, del);
          els.musicList.appendChild(row);
        }
      }

      async function loadMusic() {
        if (!els.pw.value) return;
        try {
          const { tracks } = await api("/api/music");
          renderMusic(tracks);
        } catch (error) {
          setMusicStatus("读取曲目失败：" + error.message, "err");
        }
      }

      function uploadAudioFile(file) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("POST", "/api/music");
          xhr.setRequestHeader("x-admin-password", els.pw.value);
          xhr.setRequestHeader("x-file-name", encodeURIComponent(file.name));
          xhr.setRequestHeader("content-type", file.type || "application/octet-stream");
          xhr.upload.onprogress = e => {
            if (e.lengthComputable) {
              const pct = Math.round((e.loaded / e.total) * 100);
              setMusicStatus(`上传 ${file.name} … ${pct}%（${formatBytes(e.loaded)} / ${formatBytes(e.total)}）`);
            }
          };
          xhr.onload = () => {
            let data = {};
            try {
              data = JSON.parse(xhr.responseText);
            } catch {}
            if (xhr.status >= 200 && xhr.status < 300) resolve(data);
            else reject(new Error(data.error || `HTTP ${xhr.status}`));
          };
          xhr.onerror = () => reject(new Error("网络错误"));
          xhr.send(file);
        });
      }

      async function uploadAudio(files) {
        if (!els.pw.value) return setMusicStatus("先填发文口令。", "err");
        const list = [...files];
        if (!list.length) return;

        for (let i = 0; i < list.length; i++) {
          const file = list[i];
          setMusicStatus(`准备上传 ${i + 1}/${list.length}：${file.name}`);
          try {
            await uploadAudioFile(file);
          } catch (error) {
            setMusicStatus(`第 ${i + 1} 首失败：${error.message}`, "err");
            return;
          }
        }

        els.audioFiles.value = "";
        await loadMusic();
        setMusicStatus(`已上传 ${list.length} 首`, "ok");
      }

      async function removeTrack(name) {
        if (!confirm(`确定删除《${name}》？`)) return;
        setMusicStatus("正在删除…");
        try {
          await api("/api/music?name=" + encodeURIComponent(name), { method: "DELETE" });
          await loadMusic();
          setMusicStatus("已删除。", "ok");
        } catch (error) {
          setMusicStatus("删除失败：" + error.message, "err");
        }
      }

      async function removePost() {
        if (!currentPath) return;
        const item = allPosts.find(p => p.path === currentPath);
        const label = item?.title || currentPath;
        if (!confirm(`确定删除《${label}》？\n\n会从仓库删掉这个文件，1-2 分钟后线上消失。不可撤销。`)) return;

        els.deletePost.disabled = true;
        setStatus("正在删除…");
        try {
          const data = await api("/api/post?path=" + encodeURIComponent(currentPath), {
            method: "DELETE",
          });
          setStatus(`已删除《${data.title}》。${data.note}`, "ok");
          resetForm();
          await loadList();
        } catch (error) {
          setStatus("删除失败：" + error.message, "err");
        } finally {
          els.deletePost.disabled = false;
        }
      }

      async function loadPost(path) {
        loadingPost = true;
        try {
          const { content } = await api("/api/post?path=" + encodeURIComponent(path));
          const { meta, body } = parseFrontmatter(content);
          els.title.value = meta.title || "";
          els.slug.value = path.split("/").pop().replace(/\.mdx?$/, "");
          els.desc.value = meta.description || "";
          els.tags.value = meta.tags || "";
          els.draft.checked = meta.draft === "true";
          els.body.value = body.replace(/^\n+/, "");
          if (meta.pubDatetime) {
            const d = new Date(meta.pubDatetime);
            if (!isNaN(d)) els.date.value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
          }
          updatePreview();
          updateCounter();
          dirty = false;
          currentPath = path;
          els.deletePost.hidden = false;
          setStatus(`已载入 <code>${path}</code>，修改后点发布会覆盖原文。`, "ok");
        } catch (error) {
          setStatus("载入失败：" + error.message, "err");
        } finally {
          loadingPost = false;
        }
      }

      async function submit() {
        if (!els.pw.value) return setStatus("先填发文口令。", "err");
        if (!els.title.value.trim()) return setStatus("标题不能为空。", "err");
        if (!els.desc.value.trim()) return setStatus("摘要不能为空。", "err");
        if (!els.body.value.trim()) return setStatus("正文不能为空。", "err");

        els.submit.disabled = true;
        setStatus("正在提交到 GitHub…");
        try {
          const date = els.date.value ? new Date(els.date.value).toISOString() : new Date().toISOString();
          const data = await api("/api/publish", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              title: els.title.value,
              description: els.desc.value,
              slug: els.slug.value.trim() || slugify(els.title.value),
              tags: els.tags.value.split(/[,，]/).map(t => t.trim()).filter(Boolean),
              draft: els.draft.checked,
              date,
              body: els.body.value,
            }),
          });
          dirty = false;
          setStatus(
            `${data.updated ? "已更新" : "已发布"} <code>${data.path}</code>，` +
            `<a href="${data.commit}" target="_blank" rel="noopener">查看提交</a>。<br>${data.note}` +
            `<br>线上地址（构建完成后生效）：<a href="${data.url}" target="_blank" rel="noopener">${data.url}</a>`,
            "ok"
          );
          loadList();
        } catch (error) {
          setStatus("发布失败：" + error.message, "err");
        } finally {
          els.submit.disabled = false;
        }
      }

      function resetForm() {
        els.title.value = "";
        els.slug.value = "";
        els.desc.value = "";
        els.tags.value = "";
        els.draft.checked = false;
        els.body.value = "";
        els.date.value = localNow();
        els.pick.value = "";
        currentPath = "";
        els.deletePost.hidden = true;
        updatePreview();
        updateCounter();
        dirty = false;
        setStatus("");
      }

      els.pw.addEventListener("change", () => { loadList(); loadPhotos(); loadMusic(); });
      els.pw.addEventListener("blur", () => { loadList(); loadPhotos(); loadMusic(); });
      els.files.addEventListener("change", e => uploadFiles(e.target.files));
      els.audioFiles.addEventListener("change", e => uploadAudio(e.target.files));
      els.deletePost.addEventListener("click", removePost);
      els.featuredList.addEventListener("change", e => {
        const box = e.target.closest('input[type="checkbox"]');
        if (!box) return;
        toggleFeatured(box.dataset.path, box.checked, box);
      });
      els.pick.addEventListener("change", e => {
        if (e.target.value) loadPost(e.target.value);
      });
      els.title.addEventListener("input", () => { if (!els.slug.value) updatePreview(); });
      els.slug.addEventListener("input", updatePreview);
      els.body.addEventListener("input", updateCounter);
      els.submit.addEventListener("click", submit);
      els.reset.addEventListener("click", resetForm);
      document.addEventListener("keydown", e => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          submit();
        }
      });
      document.querySelectorAll("input, textarea").forEach(el => {
        el.addEventListener("input", () => { if (!loadingPost) dirty = true; });
      });
      window.addEventListener("beforeunload", e => {
        if (dirty) { e.preventDefault(); e.returnValue = ""; }
      });

      els.date.value = localNow();
      updatePreview();
      updateCounter();
    </script>
  </body>
</html>
